name: lab-ci

services:
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__webhook__ALLOWED_HOST_LIST=*   # permite webhooks hacia "jenkins"
    volumes:
      - gitea_data:/data
    ports:
      - "3000:3000"
    networks: [ci-net]

  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks: [ci-net]

  jenkins-agent:
    build: ./agent
    container_name: jenkins-agent
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=${JENKINS_AGENT_SSH_PUBKEY}
      - DOCKER_HOST=tcp://dind:2375   # <--- LÍNEA AGREGADA
    depends_on: [dind]
    networks: [ci-net]

  dind:                       # Motor Docker aislado para los builds
    image: docker:27-dind
    container_name: dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--tls=false", "--insecure-registry=registry:5000"]
    ports:
      - "8081:8081"           # ORION API staging
      - "8082:8082"           # ORION API producción
    volumes:
      - dind_data:/var/lib/docker
    networks: [ci-net]

  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5001:5000"           # 5001 en tu equipo (en macOS el 5000 lo usa AirPlay)
    volumes:
      - registry_data:/var/lib/registry
    networks: [ci-net]

networks:
  ci-net:
    name: ci-net

volumes:
  gitea_data:
  jenkins_home:
  dind_data:
  registry_data: