{% if session.get('user_id') and session.get('rol') != 'admin' %}
<!-- ===== WIDGET FLOTANTE DE LEALTAD ===== -->
<div id="lealtadWidget" class="lealtad-widget" onclick="toggleLealtadPanel()">
    <div class="lealtad-badge-nivel" id="lealtadEmoji">🥉</div>
    <div class="lealtad-info-mini">
        <div class="lealtad-nivel-nombre" id="lealtadNivel">Bronce</div>
        <div class="lealtad-puntos-mini" id="lealtadPuntos">0 pts</div>
    </div>
    <span id="lealtadNotificacion" class="lealtad-notif" style="display:none;">!</span>
</div>

<!-- ===== PANEL EXPANDIDO ===== -->
<div id="lealtadPanel" class="lealtad-panel" style="display:none;">
    <div class="lealtad-panel-header">
        <div class="lealtad-panel-emoji" id="panelEmoji">🥉</div>
        <div>
            <div class="lealtad-panel-title" id="panelNivel">Cliente Bronce</div>
            <div class="lealtad-panel-sub">Cliente Consentido</div>
        </div>
        <button class="lealtad-panel-close" onclick="event.stopPropagation(); toggleLealtadPanel();">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="lealtad-panel-stats">
        <div class="lealtad-stat">
            <div class="lealtad-stat-num" id="panelPuntos">0</div>
            <div class="lealtad-stat-label">Puntos</div>
        </div>
        <div class="lealtad-stat">
            <div class="lealtad-stat-num" id="panelValor">$0.00</div>
            <div class="lealtad-stat-label">Valor</div>
        </div>
        <div class="lealtad-stat">
            <div class="lealtad-stat-num" id="panelCupones">0</div>
            <div class="lealtad-stat-label">Cupones</div>
        </div>
    </div>

    <div class="lealtad-progreso-wrapper" id="panelProgresoWrapper">
        <div class="lealtad-progreso-label">
            <span>Progreso a <strong id="panelSiguienteNivel">Plata</strong></span>
            <span id="panelProgresoPct">0%</span>
        </div>
        <div class="lealtad-progreso-bar">
            <div class="lealtad-progreso-fill" id="panelProgresoFill" style="width: 0%"></div>
        </div>
        <div class="lealtad-progreso-info" id="panelProgresoInfo">
            Te faltan $0 para subir
        </div>
    </div>

    <div class="lealtad-beneficios" id="panelBeneficios">
        <!-- Se llena con JavaScript -->
    </div>

    <!-- 🔥 CAMBIO: ahora apunta a la pestaña del perfil -->
    <a href="{{ url_for('web.perfil') }}#tab-consentido" class="lealtad-panel-btn">
        <i class="fas fa-crown"></i> Ver mis beneficios
    </a>
</div>
{% endif %}

<style>
/* ============================================================
   WIDGET DE LEALTAD - ESTILO ORION
   ============================================================ */
.lealtad-widget {
    position: fixed;
    top: 90px;
    right: 24px;
    z-index: 9998;
    background: linear-gradient(135deg, #E6007E, #B8005F);
    color: #fff;
    border-radius: 50px;
    padding: 8px 16px 8px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(230, 0, 126, 0.35);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    user-select: none;
}

.lealtad-widget:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 32px rgba(230, 0, 126, 0.45);
}

.lealtad-badge-nivel {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    animation: pulse-emoji 3s ease-in-out infinite;
}

@keyframes pulse-emoji {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

.lealtad-info-mini {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
}

.lealtad-nivel-nombre {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
}

.lealtad-puntos-mini {
    font-size: 0.9rem;
    font-weight: 900;
    color: #FFE082;
}

.lealtad-notif {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #FF9900;
    color: #fff;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 900;
    border: 2px solid #fff;
    animation: notif-pulse 1.5s infinite;
}

@keyframes notif-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

/* ===== PANEL EXPANDIDO ===== */
.lealtad-panel {
    position: fixed;
    top: 150px;
    right: 24px;
    width: 340px;
    max-width: calc(100vw - 48px);
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(20, 33, 61, 0.25);
    z-index: 9999;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    animation: panel-slide 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes panel-slide {
    from {
        opacity: 0;
        transform: translateY(-10px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.lealtad-panel-header {
    background: linear-gradient(135deg, #E6007E, #B8005F);
    color: #fff;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
}

.lealtad-panel-emoji {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    flex-shrink: 0;
}

.lealtad-panel-title {
    font-size: 1rem;
    font-weight: 800;
    line-height: 1.2;
}

.lealtad-panel-sub {
    font-size: 0.72rem;
    opacity: 0.85;
    margin-top: 2px;
}

.lealtad-panel-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.lealtad-panel-close:hover {
    background: rgba(255, 255, 255, 0.35);
}

.lealtad-panel-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 16px 20px;
    gap: 8px;
    background: #FAFAFC;
    border-bottom: 1px solid #ECEDF2;
}

.lealtad-stat {
    text-align: center;
}

.lealtad-stat-num {
    font-size: 1.15rem;
    font-weight: 900;
    color: #E6007E;
    line-height: 1.1;
}

.lealtad-stat-label {
    font-size: 0.65rem;
    color: #6B7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
}

.lealtad-progreso-wrapper {
    padding: 16px 20px;
    border-bottom: 1px solid #ECEDF2;
}

.lealtad-progreso-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    font-weight: 700;
    color: #14213D;
    margin-bottom: 8px;
}

.lealtad-progreso-label strong {
    color: #E6007E;
}

.lealtad-progreso-bar {
    height: 8px;
    background: #ECEDF2;
    border-radius: 10px;
    overflow: hidden;
}

.lealtad-progreso-fill {
    height: 100%;
    background: linear-gradient(90deg, #E6007E, #7A5FE0);
    border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.lealtad-progreso-info {
    font-size: 0.7rem;
    color: #6B7280;
    margin-top: 6px;
    text-align: center;
    font-weight: 600;
}

.lealtad-beneficios {
    padding: 14px 20px;
    max-height: 160px;
    overflow-y: auto;
}

.lealtad-beneficios h5 {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    color: #6B7280;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.lealtad-beneficio-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.78rem;
    color: #14213D;
    padding: 4px 0;
    line-height: 1.4;
}

.lealtad-beneficio-item i {
    color: #00A650;
    font-size: 0.75rem;
    margin-top: 3px;
    flex-shrink: 0;
}

.lealtad-panel-btn {
    display: block;
    background: linear-gradient(135deg, #E6007E, #B8005F);
    color: #fff;
    text-align: center;
    padding: 14px;
    font-weight: 800;
    font-size: 0.85rem;
    text-decoration: none;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.lealtad-panel-btn:hover {
    opacity: 0.92;
    color: #fff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .lealtad-widget {
        top: auto;
        bottom: 90px;
        right: 16px;
        padding: 6px 14px 6px 6px;
    }
    .lealtad-badge-nivel {
        width: 34px;
        height: 34px;
        font-size: 1.1rem;
    }
    .lealtad-nivel-nombre { font-size: 0.65rem; }
    .lealtad-puntos-mini { font-size: 0.8rem; }

    .lealtad-panel {
        top: auto;
        bottom: 150px;
        right: 16px;
        left: 16px;
        width: auto;
    }
}
</style>

<script>
// ============================================================
// WIDGET DE LEALTAD - LÓGICA
// ============================================================

let lealtadCargada = false;
let lealtadData = null;

// Cargar datos de lealtad
async function cargarLealtad() {
    try {
        const response = await fetch('/api/lealtad/mi-info');
        if (!response.ok) return;

        const data = await response.json();
        if (!data.success) return;

        lealtadData = data;
        lealtadCargada = true;

        // Actualizar widget flotante
        document.getElementById('lealtadEmoji').textContent = data.emoji_nivel || '🥉';
        document.getElementById('lealtadNivel').textContent = data.nivel || 'Bronce';
        document.getElementById('lealtadPuntos').textContent = (data.puntos_disponibles || 0) + ' pts';

        // Notificación si tiene cupones
        if (data.total_cupones > 0) {
            const notif = document.getElementById('lealtadNotificacion');
            notif.textContent = data.total_cupones;
            notif.style.display = 'flex';
        }

        // Actualizar panel expandido
        actualizarPanel(data);

    } catch (error) {
        console.warn('[Lealtad] Error cargando:', error);
    }
}

function actualizarPanel(data) {
    // Header
    document.getElementById('panelEmoji').textContent = data.emoji_nivel || '🥉';
    document.getElementById('panelNivel').textContent = 'Cliente ' + (data.nivel || 'Bronce');

    // Stats
    document.getElementById('panelPuntos').textContent = data.puntos_disponibles || 0;
    document.getElementById('panelValor').textContent = '$' + (data.valor_puntos || 0).toFixed(2);
    document.getElementById('panelCupones').textContent = data.total_cupones || 0;

    // Progreso
    const progreso = data.progreso || {};
    if (progreso.siguiente_nivel) {
        document.getElementById('panelSiguienteNivel').textContent = progreso.siguiente_nivel;
        document.getElementById('panelProgresoPct').textContent = progreso.progreso_pct + '%';
        document.getElementById('panelProgresoFill').style.width = progreso.progreso_pct + '%';
        document.getElementById('panelProgresoInfo').textContent =
            'Te faltan $' + (progreso.gasto_restante || 0).toFixed(0) + ' para subir';
    } else {
        document.getElementById('panelProgresoWrapper').style.display = 'none';
    }

    // Beneficios
    const beneficios = data.beneficios_actuales || [];
    const container = document.getElementById('panelBeneficios');
    if (beneficios.length > 0) {
        let html = '<h5><i class="fas fa-gift"></i> Tus beneficios</h5>';
        beneficios.forEach(function(b) {
            html += '<div class="lealtad-beneficio-item"><i class="fas fa-check-circle"></i> ' + b + '</div>';
        });
        container.innerHTML = html;
    } else {
        container.innerHTML = '<p style="font-size:0.78rem; color:#6B7280; text-align:center;">Sigue comprando para desbloquear beneficios</p>';
    }
}

function toggleLealtadPanel() {
    const panel = document.getElementById('lealtadPanel');
    const isVisible = panel.style.display === 'block';
    panel.style.display = isVisible ? 'none' : 'block';

    if (!isVisible && !lealtadCargada) {
        cargarLealtad();
    }
}

// Cerrar panel al hacer clic fuera
document.addEventListener('click', function(e) {
    const widget = document.getElementById('lealtadWidget');
    const panel = document.getElementById('lealtadPanel');
    if (widget && panel &&
        !widget.contains(e.target) &&
        !panel.contains(e.target)) {
        panel.style.display = 'none';
    }
});

// Cargar lealtad al inicio (sin mostrar panel)
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(cargarLealtad, 800);
});

// Recargar cada 60 segundos para mantener actualizado
setInterval(cargarLealtad, 60000);
</script>
