<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagos · Liverpool Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--lp-magenta:#e1007a;--lp-magenta-dark:#b80064;--lp-magenta-soft:#fce4f0;--lp-border:#e5e5e5;--lp-border-soft:#f0f0f0;--lp-bg-alt:#f7f7f7;--lp-text:#1a1a1a;--lp-text-soft:#666;--lp-text-mute:#999;--lp-radius:3px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--lp-bg-alt);color:var(--lp-text);font-size:14px;line-height:1.5;}
.lp-header{background:#fff;border-bottom:1px solid var(--lp-border);position:sticky;top:0;z-index:100;}
.lp-header__inner{max-width:1200px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.lp-header__brand{font-size:22px;font-weight:300;letter-spacing:8px;color:var(--lp-magenta);text-transform:uppercase;}
.lp-header__brand strong{font-weight:700;letter-spacing:0;}
.lp-header__breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--lp-text-mute);letter-spacing:.3px;text-transform:uppercase;}
.lp-header__breadcrumb a{color:var(--lp-text-soft);text-decoration:none;transition:color .2s;}
.lp-header__breadcrumb a:hover{color:var(--lp-magenta);}
.lp-header__breadcrumb i{font-size:8px;}
.lp-main{max-width:900px;margin:0 auto;padding:40px 24px 60px;}
.lp-title{font-size:26px;font-weight:300;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.lp-subtitle{font-size:13px;color:var(--lp-text-soft);margin-bottom:36px;}
.lp-card{background:#fff;border:1px solid var(--lp-border);border-radius:var(--lp-radius);padding:36px 40px;}
.lp-form__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 28px;margin-bottom:32px;}
.lp-field{display:flex;flex-direction:column;gap:8px;}
.lp-field--full{grid-column:1/-1;}
.lp-field label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--lp-text-soft);}
.lp-field input,.lp-field select{padding:12px 14px;border:1px solid var(--lp-border);border-radius:var(--lp-radius);font-size:14px;font-family:inherit;color:var(--lp-text);background:#fff;transition:border-color .15s,box-shadow .15s;}
.lp-field input:focus,.lp-field select:focus{outline:none;border-color:var(--lp-magenta);box-shadow:0 0 0 3px rgba(225,0,122,.08);}

/* CHECKS LIVERPOOL */
.lp-checks{display:flex;gap:10px;flex-wrap:wrap;}
.lp-check{display:flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid var(--lp-border);border-radius:var(--lp-radius);cursor:pointer;font-size:13px;transition:all .15s;background:#fff;}
.lp-check:hover{border-color:var(--lp-magenta);}
.lp-check input{accent-color:var(--lp-magenta);width:16px;height:16px;cursor:pointer;}
.lp-check input:checked ~ span{color:var(--lp-magenta);font-weight:600;}

.lp-actions{display:flex;gap:12px;justify-content:flex-end;padding-top:24px;border-top:1px solid var(--lp-border-soft);flex-wrap:wrap;}
.lp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 32px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border:1px solid transparent;border-radius:var(--lp-radius);cursor:pointer;text-decoration:none;transition:all .2s;font-family:inherit;}
.lp-btn--primary{background:var(--lp-magenta);color:#fff;}
.lp-btn--primary:hover{background:var(--lp-magenta-dark);}
.lp-btn--ghost{background:#fff;color:var(--lp-text-soft);border-color:var(--lp-border);}
.lp-btn--ghost:hover{border-color:var(--lp-text);color:var(--lp-text);}
@media(max-width:640px){.lp-header__inner{padding:14px 20px;}.lp-header__brand{font-size:18px;letter-spacing:4px;}.lp-header__breadcrumb{display:none;}.lp-main{padding:24px 16px 40px;}.lp-title{font-size:20px;}.lp-card{padding:24px 20px;}.lp-form__grid{grid-template-columns:1fr;gap:18px;}.lp-actions{flex-direction:column-reverse;}.lp-btn{width:100%;}}
</style>
</head>
<body>

<header class="lp-header">
  <div class="lp-header__inner">
    <div class="lp-header__brand">ORION<strong>.</strong></div>
    <nav class="lp-header__breadcrumb">
      <a href="{{ url_for('web.dashboard') }}">Dashboard</a>
      <i class="fas fa-chevron-right"></i>
      <a href="{{ url_for('web.configuracion') }}">Configuración</a>
      <i class="fas fa-chevron-right"></i>
      <span>Pagos</span>
    </nav>
  </div>
</header>

<main class="lp-main">

  <h1 class="lp-title">Configuración de pagos</h1>
  <p class="lp-subtitle">Métodos aceptados y pasarelas de pago.</p>

  <div class="lp-card">
    <form method="POST">
      <div class="lp-form__grid">

        <div class="lp-field lp-field--full">
          <label>Métodos de pago aceptados</label>
          {% set metodos = config.metodos_pago if config and config.metodos_pago else ['tarjeta','paypal','oxxo'] %}
          <div class="lp-checks">
            <label class="lp-check">
              <input type="checkbox" name="metodos_pago" value="tarjeta" {% if 'tarjeta' in metodos %}checked{% endif %}>
              <span><i class="fas fa-credit-card"></i> Tarjeta</span>
            </label>
            <label class="lp-check">
              <input type="checkbox" name="metodos_pago" value="paypal" {% if 'paypal' in metodos %}checked{% endif %}>
              <span><i class="fab fa-paypal"></i> PayPal</span>
            </label>
            <label class="lp-check">
              <input type="checkbox" name="metodos_pago" value="oxxo" {% if 'oxxo' in metodos %}checked{% endif %}>
              <span><i class="fas fa-store"></i> OXXO</span>
            </label>
          </div>
        </div>

        <div class="lp-field">
          <label for="moneda">Moneda base</label>
          <select id="moneda" name="moneda">
            {% set mon = config.moneda if config else 'MXN' %}
            <option value="MXN" {% if mon=='MXN' %}selected{% endif %}>MXN</option>
            <option value="USD" {% if mon=='USD' %}selected{% endif %}>USD</option>
            <option value="EUR" {% if mon=='EUR' %}selected{% endif %}>EUR</option>
          </select>
        </div>

        <div class="lp-field">
          <label for="iva_porcentaje">IVA (%)</label>
          <input type="number" id="iva_porcentaje" step="0.01" name="iva_porcentaje"
                 value="{{ config.iva_porcentaje if config else 16 }}">
        </div>

        <div class="lp-field lp-field--full">
          <label for="stripe_key">Stripe Secret Key</label>
          <input type="password" id="stripe_key" name="stripe_key"
                 value="{{ config.stripe_key if config else '' }}"
                 placeholder="sk_live_...">
        </div>

        <div class="lp-field">
          <label for="paypal_client_id">PayPal Client ID</label>
          <input type="text" id="paypal_client_id" name="paypal_client_id"
                 value="{{ config.paypal_client_id if config else '' }}">
        </div>

        <div class="lp-field">
          <label for="paypal_secret">PayPal Secret</label>
          <input type="password" id="paypal_secret" name="paypal_secret"
                 value="{{ config.paypal_secret if config else '' }}">
        </div>

      </div>

      <div class="lp-actions">
        <a href="{{ url_for('web.dashboard') }}" class="lp-btn lp-btn--ghost">Cancelar</a>
        <button type="submit" class="lp-btn lp-btn--primary">
          <i class="fas fa-check"></i> Guardar cambios
        </button>
      </div>
    </form>
  </div>

</main>

</body>
</html>
