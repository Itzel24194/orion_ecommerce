<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION Admin - Gestión de Atributos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 shadow rounded">
        <h2 class="mb-4">Gestión de Atributos</h2>
        
        <form id="attr-form" method="POST" action="{{ url_for('web.agregar_atributo') }}" class="row g-3 mb-4">
            <div class="col-md-4">
                <input id="nombre" name="nombre" class="form-control" placeholder="Nombre (Ej: Talla)" required>
            </div>
            <div class="col-md-5">
                <input id="valores" name="valores" class="form-control" placeholder="Valores (Ej: S,M,L)" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100" id="btn-save">Guardar Atributo</button>
            </div>
        </form>

        <table class="table table-bordered bg-white table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Atributo</th>
                    <th>Valores</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for a in atributos %}
                <tr>
                    <td>{{ a.nombre }}</td>
                    <td>{{ a.valores|join(', ') }}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" 
                                onclick="editar('{{ a._id }}', '{{ a.nombre }}', '{{ a.valores|join(',') }}')">
                            Editar
                        </button>
                        <a href="{{ url_for('web.borrar_atributo', id=a._id) }}" class="btn btn-sm btn-danger">Borrar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function editar(id, nombre, valores) {
            // Llenar inputs
            document.getElementById('nombre').value = nombre;
            document.getElementById('valores').value = valores;
            
            // Cambiar acción del formulario dinámicamente
            const form = document.getElementById('attr-form');
            form.action = '/admin/atributos/editar/' + id;
            
            // Cambiar texto del botón
            const btn = document.getElementById('btn-save');
            btn.innerText = 'Actualizar Atributo';
            btn.classList.replace('btn-primary', 'btn-warning');
            
            // Scroll hacia el formulario para mejor UX
            window.scrollTo(0, 0);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
