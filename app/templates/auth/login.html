<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION // SYSTEM_ULTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00d4ff;
            --bg-deep: #020202;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-deep);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        .ultra-bg {
            position: absolute;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a001a, #000);
            z-index: 0;
        }

        .ultra-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-blue), var(--neon-pink));
            filter: blur(150px);
            opacity: 0.25;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .top-bar {
            position: fixed; top: 0; width: 100%; height: 65px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--neon-pink);
            color: white; font-weight: 900; font-size: 1.8rem; letter-spacing: 20px;
            z-index: 100; text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            transition: 0.4s;
        }

        .top-bar:hover { letter-spacing: 25px; border-bottom-color: var(--neon-blue); }

        /* NUEVO: CONTENEDOR CON ELEVACIÓN SIN COLORES DE BORDE */
        .card-wrapper {
            position: relative; z-index: 10;
            padding: 1px;
            border-radius: 71px;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-wrapper:hover {
            transform: translateY(-15px) scale(1.02);
        }

        /* TARJETA DE CRISTAL OSCURO */
        .login-card {
            width: 400px; padding: 4rem;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 70px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            transition: 0.5s;
        }

        /* Iluminación sutil al hacer hover en el contenedor */
        .card-wrapper:hover .login-card {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.05);
        }

        h2 { color: white; font-weight: 900; margin-bottom: 2.5rem; letter-spacing: -1px; }

        .input-box {
            width: 100%; padding: 20px; margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; color: white;
            transition: 0.4s;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-entry {
            width: 100%; padding: 20px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            color: white; border: none; border-radius: 20px;
            font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            cursor: pointer; transition: 0.4s;
        }

        .btn-entry:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.3);
        }

        .links a {
            display: block; color: rgba(255,255,255,0.4);
            text-decoration: none; font-size: 0.75rem; margin-top: 20px;
            transition: 0.3s;
        }
        .links a:hover { color: var(--neon-blue); }
    </style>
</head>
<body>

    <div class="ultra-bg"></div>
    <div class="top-bar">ORION</div>

    <div class="card-wrapper">
        <div class="login-card">
            <h2>ENTRAR</h2>
            <form action="{{ url_for('web.login') }}" method="POST">
                <input type="email" name="email" class="input-box" placeholder="USUARIO" required>
                <input type="password" name="password" class="input-box" placeholder="CONTRASEÑA" required>
                <button type="submit" class="btn-entry">ACCEDER</button>
            </form>
            <div class="links">
                <a href="{{ url_for('web.register') }}">¿AÚN NO TIENES CUENTA? REGÍSTRATE</a>
                <a href="{{ url_for('web.recuperar_password') }}">RECUPERAR ACCESO</a>
            </div>
        </div>
    </div>

</body>
</html>
