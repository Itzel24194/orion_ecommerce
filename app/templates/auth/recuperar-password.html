<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - ORION SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00d4ff;
            --bg-deep: #020202;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-deep);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* FONDO ANIMADO */
        .ultra-bg {
            position: absolute;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a001a, #000);
            z-index: 0;
        }

        .ultra-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-blue), var(--neon-pink));
            filter: blur(150px);
            opacity: 0.25;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* BARRA ORION */
        .top-bar {
            position: fixed; top: 0; width: 100%; height: 65px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--neon-pink);
            color: white; font-weight: 900; font-size: 1.8rem; letter-spacing: 20px;
            z-index: 100; text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            transition: 0.4s;
        }

        .top-bar:hover { 
            letter-spacing: 25px; 
            border-bottom-color: var(--neon-blue); 
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        /* CONTENEDOR REACTIVO */
        .card-wrapper {
            position: relative; z-index: 10;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-wrapper:hover { transform: translateY(-15px) scale(1.02); }

        .recover-card {
            width: 400px; padding: 4rem;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 70px;
            color: white; text-align: center;
            transition: 0.5s;
        }
        .card-wrapper:hover .recover-card { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }

        h4 { font-weight: 900; margin-bottom: 2rem; }

        .input-box {
            width: 100%; padding: 20px; margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; color: white;
        }
        .input-box:focus { outline: none; border-color: var(--neon-blue); background: rgba(255, 255, 255, 0.07); }

        .btn-recover {
            width: 100%; padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white; border: none; border-radius: 20px;
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.4s;
        }
        .btn-recover:hover { background: var(--neon-blue); color: #000; }

        .links a {
            display: block; color: rgba(255,255,255,0.4);
            text-decoration: none; font-size: 0.75rem; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="ultra-bg"></div>
    <div class="top-bar">ORION</div>

    <div class="card-wrapper">
        <div class="recover-card">
            <h4>RECUPERAR ACCESO</h4>
            <form action="{{ url_for('web.recuperar_password') }}" method="POST">
                <input type="email" name="email" class="input-box" placeholder="TU CORREO" required>
                <button type="submit" class="btn-recover">ENVIAR INSTRUCCIONES</button>
            </form>
            
            <div class="links">
                <a href="{{ url_for('web.login') }}">VOLVER AL LOGIN</a>
            </div>
        </div>
    </div>

</body>
</html>
