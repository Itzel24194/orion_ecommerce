<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - ORION SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon-pink: #ff007f; --neon-blue: #00d4ff; --bg-deep: #020202; }
        
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--bg-deep); 
            font-family: 'Outfit', sans-serif; 
            overflow-x: hidden; 
            padding: 20px 0; /* Margen extra por si la tarjeta es muy alta */
        }

        .ultra-bg { position: fixed; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #1a001a, #000); z-index: 0; }
        .ultra-bg::after { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-blue), var(--neon-pink)); filter: blur(150px); opacity: 0.25; animation: rotate 20s linear infinite; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-bar { 
            position: fixed; top: 0; width: 100%; height: 65px; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); 
            border-bottom: 2px solid var(--neon-pink); color: white; 
            font-weight: 900; font-size: 1.8rem; letter-spacing: 20px; 
            z-index: 100; text-transform: uppercase; 
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3); 
        }

        .card-wrapper { 
            position: relative; 
            z-index: 10; 
            margin-top: 80px; 
            transition: 0.5s; 
            max-width: 90%; /* Para que no choque con los bordes en móvil */
        }

        .profile-card { 
            width: 450px; 
            max-width: 100%; /* Se adapta al contenedor */
            padding: 3rem; 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(50px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 40px; 
            color: white; 
            text-align: center; 
            box-sizing: border-box; /* Evita que el padding se salga */
            transition: 0.5s;
        }
        
        h3 { font-weight: 900; margin-bottom: 2rem; color: #fff; text-transform: uppercase; letter-spacing: 2px; }

        .input-box { 
            width: 100%; 
            padding: 18px; 
            margin-bottom: 1.2rem; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            color: white; 
            box-sizing: border-box; 
            font-size: 1rem; 
            transition: 0.3s; 
        }
        .input-box:focus { outline: none; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        /* ⭐ NUEVO: Estilos para cuando un campo tiene error */
        .input-box.error, .input-date.error {
            border-color: #ff3333 !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3) !important;
        }

        .date-section { margin-bottom: 1.5rem; text-align: left; }
        .date-title { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 0.8rem; display: block; letter-spacing: 1.5px; text-transform: uppercase; }
        .date-container { display: flex; gap: 12px; }
        .input-date { 
            width: 100%; padding: 15px 5px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            color: white; 
            text-align: center;
            font-weight: 500;
            font-size: 1.1rem;
            transition: 0.3s;
            box-sizing: border-box; /* Para que no se desborde */
        }
        .input-date:focus { border-color: var(--neon-pink); background: rgba(255, 255, 255, 0.1); outline: none; }

        .gender-section { margin-bottom: 2rem; text-align: left; }
        .gender-title { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 0.8rem; display: block; letter-spacing: 1.5px; text-transform: uppercase; }
        .sex-options { display: flex; justify-content: space-around; color: rgba(255,255,255,0.7); font-size: 0.9rem; flex-wrap: wrap; gap: 10px; }

        .btn-orion { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-orion:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* =========================================
           REGLAS RESPONSIVAS (Ajustes para móviles y tablets)
           ========================================= */
        @media (max-width: 600px) {
            .top-bar {
                font-size: 1.2rem;
                letter-spacing: 10px;
            }
            .card-wrapper {
                max-width: 95%; /* Usa casi todo el ancho de la pantalla */
                margin-top: 90px; /* Un poco más de margen por la barra superior */
            }
            .profile-card {
                padding: 2rem 1.5rem; /* Reducir padding en móvil */
                border-radius: 30px;
            }
            h3 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
            .date-container {
                flex-wrap: wrap; /* Si no cabe, que se pongan uno debajo de otro */
            }
            .input-date {
                width: calc(33.33% - 8px); /* Ajustar para que quepan los 3 en móvil */
                font-size: 1rem;
            }
            .sex-options {
                flex-direction: column; /* Poner los radios uno debajo de otro si no caben */
                align-items: flex-start;
                gap: 10px;
                padding-left: 10px;
            }
            .sex-options label {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
            }
        }

        @media (max-width: 400px) {
            /* Ajustes para pantallas muy pequeñas */
            .profile-card {
                padding: 1.5rem 1rem;
            }
            .input-box, .input-date, .btn-orion {
                padding: 14px;
                font-size: 0.95rem;
            }
            h3 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="ultra-bg"></div>
    <div class="top-bar">ORION</div>

    <div class="card-wrapper">
        <div class="profile-card">
            <h3>DATOS DE PERFIL</h3>
            
            <!-- Agregamos id="formPerfil" para controlarlo con JS -->
            <form id="formPerfil" action="{{ url_for('web.register_profile') }}" method="POST">
                <input type="text" name="nombre" id="nombre" class="input-box" placeholder="NOMBRE(S)*" required minlength="2">
                <input type="text" name="apellido_p" id="apellido_p" class="input-box" placeholder="APELLIDO PATERNO*" required minlength="2">
                <input type="text" name="apellido_m" id="apellido_m" class="input-box" placeholder="APELLIDO MATERNO">
                
                <div class="date-section">
                    <label class="date-title">Fecha de nacimiento</label>
                    <div class="date-container">
                        <input type="number" name="dia" id="dia" class="input-date" placeholder="DD" min="1" max="31" required>
                        <input type="number" name="mes" id="mes" class="input-date" placeholder="MM" min="1" max="12" required>
                        <input type="number" name="anio" id="anio" class="input-date" placeholder="AAAA" min="1900" max="2026" required>
                    </div>
                </div>
                
                <div class="gender-section">
                    <label class="gender-title">Género</label>
                    <div class="sex-options">
                        <label><input type="radio" name="genero" value="mujer" required> MUJER</label>
                        <label><input type="radio" name="genero" value="hombre" required> HOMBRE</label>
                        <label><input type="radio" name="genero" value="indefinido" required> INDEFINIDO</label>
                    </div>
                </div>
                
                <button type="submit" class="btn-orion">FINALIZAR REGISTRO</button>
            </form>
        </div>
    </div>

    <!-- ⭐ SCRIPT DE VALIDACIÓN EXTRA -->
    <script>
        document.getElementById('formPerfil').addEventListener('submit', function(e) {
            let valido = true;
            
            // Limpiar errores previos
            document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));

            // Validar Nombre y Apellido Paterno (aunque HTML5 ya lo hace, esto es más estricto)
            const nombre = document.getElementById('nombre');
            const apellido = document.getElementById('apellido_p');
            
            if (nombre.value.trim() === '') {
                nombre.classList.add('error');
                valido = false;
            }
            if (apellido.value.trim() === '') {
                apellido.classList.add('error');
                valido = false;
            }

            // Validar Fecha
            const dia = parseInt(document.getElementById('dia').value);
            const mes = parseInt(document.getElementById('mes').value);
            const anio = parseInt(document.getElementById('anio').value);

            if (isNaN(dia) || isNaN(mes) || isNaN(anio)) {
                valido = false;
                document.querySelectorAll('.input-date').forEach(el => el.classList.add('error'));
            } else {
                // Validación real de fecha (ej. evitar 31 de Febrero)
                const fecha = new Date(anio, mes - 1, dia);
                if (fecha.getFullYear() !== anio || fecha.getMonth() !== mes - 1 || fecha.getDate() !== dia) {
                    alert('⚠️ La fecha de nacimiento ingresada no es válida (ej. 31 de Febrero). Por favor, revísala.');
                    document.querySelectorAll('.input-date').forEach(el => el.classList.add('error'));
                    valido = false;
                }
            }

            // Validar Género
            const generoSeleccionado = document.querySelector('input[name="genero"]:checked');
            if (!generoSeleccionado) {
                valido = false;
                alert('⚠️ Por favor, selecciona un género.');
            }

            // Si algo falló, detenemos el envío y mostramos un mensaje
            if (!valido) {
                e.preventDefault();
                if (nombre.value.trim() === '' || apellido.value.trim() === '') {
                    alert('⚠️ Los campos NOMBRE y APELLIDO PATERNO son obligatorios.');
                }
            }
        });
    </script>

</body>
</html>
