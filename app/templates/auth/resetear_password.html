<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - ORION SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Outfit', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #080808;
        color: white;
    }

    .container {
        width: 400px;
        padding: 40px;
        background: #111;
        border-radius: 18px;
        border: 1px solid #ff1493;
        box-shadow: 0 0 25px rgba(255, 20, 147, 0.35);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #ff1493;
    }

    .description {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #ddd;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1c1c1c;
        color: white;
        outline: none;
    }

    input:focus {
        border-color: #00bfff;
        box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #ff1493, #00bfff);
        color: white;
        font-weight: 700;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    .login {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #00bfff;
        text-decoration: none;
    }
</style>

</head>

<body>

<div class="container">

    <h1>RESTABLECER CONTRASEÑA</h1>

    <p class="description">
        Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.
    </p>

    <form action="{{ url_for('web.resetear_password', token=token) }}" method="POST">

        <label for="password">Nueva contraseña</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu nueva contraseña"
            required
        >

        <label for="confirm_password">Confirmar contraseña</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirma tu nueva contraseña"
            required
        >

        <button type="submit">
            CAMBIAR CONTRASEÑA
        </button>

    </form>

    <a href="{{ url_for('web.login') }}" class="login">
        Volver al inicio de sesión
    </a>

</div>

</body>
</html>
